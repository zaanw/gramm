name: Gramm Windows x64

on:
  push:
    branches: [codex/setup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gramm-windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd
    env:
      CARGO_INCREMENTAL: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'

    steps:
      - name: Check out sources and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: TBuild/gramm
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Initialize MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          sdk: '10.0.26100.0'
          toolset: '14.44'

      - name: Check the target and set up dependency directories
        shell: pwsh
        run: |
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64' -or $env:Platform -ne 'x64') {
            throw 'Use the x64 Native Tools Command Prompt'
          }
          New-Item -ItemType Directory -Force TBuild/ThirdParty, TBuild/Libraries/win64 | Out-Null
          git config --global user.name "Gramm Windows CI"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, Used, Free

      - name: Restore dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            TBuild/ThirdParty
            TBuild/Libraries/win64
          key: gramm-win2025-x64-14.44-sdk26100-debug-${{ hashFiles('TBuild/gramm/Telegram/build/prepare/**', 'TBuild/gramm/Telegram/build/qt_version.py') }}

      - name: Build upstream dependencies
        working-directory: TBuild/gramm
        run: call Telegram\build\prepare\win.bat skip-release silent

      - name: Configure the baseline client
        working-directory: TBuild/gramm/Telegram
        run: >-
          call configure.bat -G "Ninja Multi-Config"
          -D TDESKTOP_API_TEST=ON
          -D CMAKE_CONFIGURATION_TYPES=Debug
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Compile and link Windows x64
        working-directory: TBuild/gramm
        run: cmake --build out --config Debug --target Telegram

      - name: Verify and package the executable
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath TBuild/gramm/out/Debug/Telegram.exe
          $stream = [IO.File]::OpenRead($exe.FullName)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Missing DOS executable header' }
            $stream.Position = 0x3c
            $stream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) {
              throw 'Expected a Windows AMD64 PE executable'
            }
          } finally {
            $stream.Dispose()
          }
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination artifact
          Copy-Item -LiteralPath TBuild/gramm/LICENSE, TBuild/gramm/LEGAL -Destination artifact
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Telegram.exe" | Set-Content -Encoding ascii artifact/SHA256SUMS.txt
          "Source commit: $env:GITHUB_SHA" | Set-Content -Encoding utf8 artifact/build-info.txt
          "Configuration: Windows x64 Debug, Telegram test API ID" | Add-Content -Encoding utf8 artifact/build-info.txt

      - name: Upload baseline executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gramm-windows-x64-baseline-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
